# Optional profiles. Applying a profile replaces the current shader queue.
[fsr1]
profile-desc=FSR1 upscaling and sharpening
glsl-shaders=~~/shaders/AMD/AMD_FSR1_RT.glsl

[sharpen]
profile-desc=Light adaptive sharpening
glsl-shaders=~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_RT.glsl

[deband]
profile-desc=Homogeneous-region debanding
glsl-shaders=~~/shaders/Deband/hdeband.glsl

[no-shaders]
profile-desc=Clear the shader queue
glsl-shaders-clr
