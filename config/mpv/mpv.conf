# Adapted from mpv_PlayKit main; see UPSTREAM.md for the pinned source and changes.
# Use native Wayland, preferring Vulkan with EGL as a fallback.
vo=gpu-next
gpu-context=waylandvk,wayland
hwdec=auto-safe
ao=pipewire,pulse

# Keep the player and its controller available after playback ends.
idle=yes
keep-open=yes
force-window=yes
autofit-larger=90%x90%
keepaspect-window=yes
use-filedir-conf=no
input-builtin-bindings=yes

# uosc replaces the built-in on-screen controller. Statistics remain built in.
osc=no
osd-font=sans-serif
sub-font=sans-serif
sub-codepage=auto
sub-auto=fuzzy
sub-file-paths=sub:Subs:subtitles

# Resume the file position; volume and mute are saved separately by a script.
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid
watch-later-dir=~~state/watch_later
gpu-shader-cache-dir=~~cache/shaders
icc-cache-dir=~~cache/icc

# No shader or interpolation is enabled automatically.
scale=lanczos
dscale=hermite
deband=no
interpolation=no
video-sync=audio
volume=100
volume-max=130
include=~~/profiles.conf
