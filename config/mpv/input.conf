# Main-branch playback bindings adapted for Linux; omitted keys retain mpv defaults.
MBTN_RIGHT script-binding uosc/menu-blurred
MBTN_LEFT_DBL cycle fullscreen
MBTN_BACK playlist-prev
MBTN_FORWARD playlist-next
WHEEL_UP seek -10
WHEEL_DOWN seek 10
q quit
Q quit-watch-later
SPACE cycle pause
f cycle fullscreen
ENTER set fullscreen yes
ESC set fullscreen no
LEFT seek -5
RIGHT seek 5
Shift+LEFT seek -1 exact
Shift+RIGHT seek 1 exact
UP sub-seek -1
DOWN sub-seek 1
Ctrl+LEFT cycle-values video-rotate 0 270 180 90
Ctrl+RIGHT cycle-values video-rotate 0 90 180 270
Ctrl+v script-binding uosc/paste-to-open
[ add speed -0.1
] add speed 0.1
BS set speed 1.0
l ab-loop
L cycle-values loop-file inf no
, frame-back-step
. frame-step
d cycle deinterlace
D cycle deband
i script-binding stats/display-stats
I script-binding stats/display-stats-toggle
TAB script-binding uosc/playlist
Ctrl+o script-binding uosc/open-file
Ctrl+s script-binding uosc/load-subtitles
Ctrl+a script-binding uosc/audio
Ctrl+g script-message uosc-menu-shader
Ctrl+j script-message uosc-menu-subtext
Ctrl+p script-message uosc-menu-prop
Ctrl+t script-binding thumb_engine/thumb_toggle

# English context-menu entries. The prefix # lets uosc expose unbound commands.
# script-binding uosc/open-file #! Load > File browser
# script-binding uosc/load-subtitles #! Load > Subtitles
# script-binding uosc/playlist #! Navigate > Playlist
# script-binding uosc/chapters #! Navigate > Chapters
# script-binding uosc/video #! Tracks > Video
# script-binding uosc/audio #! Tracks > Audio
# script-binding uosc/subtitles #! Tracks > Subtitles
# script-message uosc-menu-shader #! Video > Shaders
# script-message uosc-menu-subtext #! Subtitles > Subtitle lines
# apply-profile no-shaders #! Video > Clear shaders
# script-binding thumb_engine/thumb_toggle #! Video > Toggle thumbnails
# script-binding stats/display-stats-toggle #! Tools > Statistics
# script-binding uosc/audio-device #! Tools > Audio device
# script-binding uosc/show-in-directory #! Tools > Show file directory
# quit #! Quit
