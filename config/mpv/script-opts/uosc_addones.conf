# Browse the three bundled shaders without applying one automatically.
shader_dir=~~/shaders/
shader_exts=glsl
shader_action_prefer=set
shader_preset_save=persist
# Kaenix extension: resolve xdg to $XDG_STATE_HOME/mpv (or its standard fallback).
shader_cache_dir=xdg
subtext_merge=no
prop_show_values=no
prop_action_prefer=show
vcs_tiles=12
