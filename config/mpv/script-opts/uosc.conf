# Timeline and controls from the main-branch uosc configuration.
timeline_style=line
timeline_size=40
timeline_cache=yes
timeline_heatmap=no
controls=menu,ST-thumb_tog,gap,play_pause,gap,subtitles,audio,chapters,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
volume=right
top_bar=no-border
top_bar_controls=right
autoload=no
load_types=video
scale=0
refine=text_width,sorting
thumbnail_provider=thumb_engine
thumbnail_mode=natural
custom_font=sans-serif
